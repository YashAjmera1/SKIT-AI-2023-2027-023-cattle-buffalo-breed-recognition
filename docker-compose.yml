version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skit_livestock_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./breed_recognition.db
      - MAX_UPLOAD_MB=10
    volumes:
      - ./backend/models:/app/models
      - ./backend/breed_recognition.db:/app/breed_recognition.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skit_livestock_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

